services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: e-commerce-loyalty-app
        ports:
            - "8000:8000"
        environment: &app-env
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: "3306"
            DB_DATABASE: loyalty
            DB_USERNAME: loyalty
            DB_PASSWORD: secret
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        volumes:
            - storage:/var/www/html/storage
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/.migrated"]
            interval: 5s
            timeout: 3s
            retries: 30
        depends_on:
            db:
                condition: service_healthy
        networks:
            - loyalty

    queue:
        image: e-commerce-loyalty-app
        command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
        environment: *app-env
        volumes:
            - storage:/var/www/html/storage
        depends_on:
            app:
                condition: service_healthy
        networks:
            - loyalty

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: loyalty
            MYSQL_USER: loyalty
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - loyalty

networks:
    loyalty:
        driver: bridge

volumes:
    db-data:
    storage:
