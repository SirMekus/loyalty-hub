services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: e-commerce-loyalty-app
        ports:
            - "8000:8000"
        # Only DB_HOST/PORT/USERNAME/PASSWORD are set here, for entrypoint.sh's shell-level
        # "wait for the database" check. Everything else (DB_CONNECTION, QUEUE_CONNECTION,
        # SESSION_DRIVER, CACHE_STORE, APP_ENV, ...) lives in the .env baked into the image
        # (see .env.docker) rather than as real container env vars — PHP populates $_SERVER
        # from the real process environment, and phpunit.xml's test-only overrides can't
        # win against a $_SERVER value, only against .env-sourced values. Setting these here
        # would silently make `composer test` run against the real MySQL DB and the real
        # (async) queue connection instead of the isolated sqlite/sync setup tests expect.
        environment: &app-env
            DB_HOST: db
            DB_PORT: "3306"
            DB_USERNAME: loyalty
            DB_PASSWORD: secret
        volumes:
            - storage:/var/www/html/storage
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/.migrated"]
            interval: 5s
            timeout: 3s
            retries: 30
        depends_on:
            db:
                condition: service_healthy
        networks:
            - loyalty

    queue:
        image: e-commerce-loyalty-app
        command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
        environment: *app-env
        volumes:
            - storage:/var/www/html/storage
        depends_on:
            app:
                condition: service_healthy
        networks:
            - loyalty

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: loyalty
            MYSQL_USER: loyalty
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - loyalty

networks:
    loyalty:
        driver: bridge

volumes:
    db-data:
    storage:
